[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "osint-tools"
version = "1.0.0"
description = "A comprehensive toolkit for Open Source Intelligence (OSINT) gathering."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dhruvi Talsaniya", email = "your_email@example.com" }]
requires-python = ">=3.8"
keywords = ["osint", "security", "intelligence", "ip-lookup", "whois", "email"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "python-whois>=0.8",
    "dnspython>=2.2",
    "click>=8.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/dhruvi-talsaniya/Osint_tools"
"Bug Tracker" = "https://github.com/dhruvi-talsaniya/Osint_tools/issues"

[project.scripts]
osint-tools = "osint_tools.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
